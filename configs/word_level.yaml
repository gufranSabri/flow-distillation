APPROACH: "word_level"

# ── Distillation ───────────────────────────────────────────────────────────────
# KD-only: the student never sees the Dolly ground-truth response as a CE target,
# only the teacher's next-token distribution (see src/trainers/word_level.py::kd_loss).
# For a CE/SFT baseline on the same data, use pretraining.py instead.
TEMPERATURE: 1.0      # tau; 1.0 = MiniLLM word-level KD, >1 = Hinton (loss scaled by tau^2)

# ── Student ────────────────────────────────────────────────────────────────────
FINETUNE_MODE: "lora"   # full | lora
LORA_R: 16
LORA_ALPHA: 32
LORA_DROPOUT: 0.05
LORA_TARGET_MODULES: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]

# ── Training ───────────────────────────────────────────────────────────────────
LR: 1.0e-4
WARMUP_RATIO: 0.03
WEIGHT_DECAY: 0.0
MAX_GRAD_NORM: 1.0

LOG_EVERY: 10
EVAL_EVERY: 200
SAVE_EVERY: 200
SAVE_TOTAL_LIMIT: 3
