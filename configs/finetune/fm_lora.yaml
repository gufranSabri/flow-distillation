# Flow-matching LoRA (see docs/flow-matching-lora.md)
# Each targeted linear's adapter delta is produced by an integrated flow whose
# target is the frozen base model's own activation at that site.

# ── Sites ──────────────────────────────────────────────────────────────────────
FINETUNE_MODE: "fm_lora"   # informational; this trio always replaces the targeted linears
LORA_TARGET_MODULES: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]

# ── Velocity network v_theta(z_t, t, x) ────────────────────────────────────────
FM_VELOCITY_HIDDEN: 256    # width of the per-site MLP
FM_TIME_EMBED_DIM: 64      # sinusoidal timestep embedding width
FM_COND_RANK: 16           # rank of the bottleneck that conditions on x (LoRA-comparable cost)
FM_NORMALIZE_TARGET: true  # per-site RMS normalization of x1 (see docs §7.5)

# ── Flow ───────────────────────────────────────────────────────────────────────
FM_INFER_STEPS: 8          # Euler steps per site per token at inference (docs §5)
FM_LOSS_REDUCTION: "mean"  # mean | sum over sites

# ── Training ───────────────────────────────────────────────────────────────────
LR: 1.0e-4
WARMUP_RATIO: 0.03
WEIGHT_DECAY: 0.0
MAX_GRAD_NORM: 1.0

LOG_EVERY: 10
EVAL_EVERY: 500
SAVE_EVERY: 500
SAVE_TOTAL_LIMIT: 3
