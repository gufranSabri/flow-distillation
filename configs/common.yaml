seed: 42

# Student/teacher model ids are CLI-only (distill.py --student-model / --teacher-model), no default here.

# ── Dataset ────────────────────────────────────────────────────────────────────
DATASET_ID: "databricks/databricks-dolly-15k"
DOLLY_DEV_NUM: 1000   # first N raw rows held out as the fixed valid split; must match benchmark.py's --dolly-dev-num
MAX_TRAIN_SAMPLES: -1
MAX_VAL_SAMPLES: -1
MAX_LENGTH: 2048

# ── Distillation loss ──────────────────────────────────────────────────────────
# Divergence to match teacher/student next-token distributions with: forward_kl | reverse_kl | both
DISTILL_LOSS: "reverse_kl"

# ── Training ───────────────────────────────────────────────────────────────────
TRAIN_EPOCHS: 1
PER_DEVICE_TRAIN_BATCH_SIZE : 1
PER_DEVICE_EVAL_BATCH_SIZE  : 1
GRADIENT_ACCUMULATION_STEPS : 32
LR: 3.0e-4


# MISC
WORK_DIR_ROOT: ~/scratch/distillation
